name: contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  zone-check:
    runs-on: ubuntu-latest
    steps:
      # Run the script from the base branch: a PR must not be able to rewrite its own gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Check ownership zones and approvals
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: .github/scripts/zone-check.sh

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint OpenAPI (skipped until a spec exists)
        run: |
          if ls contracts/openapi/*.yaml >/dev/null 2>&1; then
            npx --yes @redocly/cli@1.25.0 lint contracts/openapi/*.yaml
          else
            echo "No OpenAPI files yet."
          fi

  # v1 is additive only (contracts/README.md): fail on a breaking change against the base branch.
  openapi-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare contracts/openapi with the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- contracts/openapi/)
          if [ -z "$changed" ]; then
            echo "contracts/openapi is unchanged."
            exit 0
          fi
          go install github.com/oasdiff/oasdiff@v1.34.1
          status=0
          for spec in $changed; do
            if ! git cat-file -e "$BASE_SHA:$spec" 2>/dev/null; then
              echo "$spec is new, nothing to compare."
              continue
            fi
            if [ ! -f "$spec" ]; then
              echo "::error file=$spec::$spec was removed; v1 is additive only."
              status=1
              continue
            fi
            git show "$BASE_SHA:$spec" > "$RUNNER_TEMP/base.yaml"
            "$(go env GOPATH)/bin/oasdiff" breaking "$RUNNER_TEMP/base.yaml" "$spec" --fail-on ERR -f githubactions || status=1
          done
          exit $status

  # Fixtures are acceptance tests for both sides; see contracts/fixtures/README.md.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate contracts/fixtures against the OpenAPI schemas and event-types.yaml
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/fx" ajv@8.17.1 ajv-formats@3.0.1 yaml@2.6.1
          NODE_PATH="$RUNNER_TEMP/fx/node_modules" node .github/scripts/validate-fixtures.cjs .
