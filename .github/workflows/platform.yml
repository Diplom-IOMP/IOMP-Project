name: platform

on:
  pull_request:
    paths:
      - 'platform/**'
      - 'contracts/openapi/**'
      - 'contracts/fixtures/**'
      - 'contracts/event-types.yaml'
      - '.github/workflows/platform.yml'
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'contracts/openapi/**'
      - 'contracts/fixtures/**'
      - 'contracts/event-types.yaml'
      - '.github/workflows/platform.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iomp
          POSTGRES_PASSWORD: iomp
          POSTGRES_DB: iomp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iomp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database, not a secret.
      DATABASE_URL: postgres://iomp:iomp@localhost:5432/iomp_test
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
